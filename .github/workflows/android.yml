name: Android release
# Al subir una etiqueta android-vX.Y.Z se compila el APK firmado y se publica en GitHub Releases.
# La app Android lee ese release para actualizarse. Las etiquetas vX.Y.Z siguen siendo las de escritorio.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Pruebas del planificador
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Firma (si hay secretos)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/clipforge.jks"
            echo "CLIPFORGE_KEYSTORE=$RUNNER_TEMP/clipforge.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Faltan los secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Sin una firma estable Android no permite actualizar encima de la versión instalada. Mira android/README.md."
            exit 1
          else
            echo "::warning::Sin secretos de firma: APK de prueba firmado con la clave de depuración."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar APK
        env:
          CLIPFORGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLIPFORGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLIPFORGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0"
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release*.apk "ClipForge-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-android-apk
          path: android/ClipForge-Android-*.apk
      - name: Publicar en el release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Android ${GITHUB_REF_NAME#android-v}" --generate-notes --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$GITHUB_REF_NAME" ClipForge-Android-*.apk --clobber --repo "$GITHUB_REPOSITORY"
