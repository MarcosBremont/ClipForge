name: Build and release
# Al subir una etiqueta (git tag v1.0.1 && git push --tags) se compilan los instaladores y se
# publican en GitHub Releases junto con latest.yml / latest-mac.yml, que es lo que lee la app para actualizarse.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run typecheck
      # En macOS no hay autoactualización sin firma de Apple, así que sus pruebas no bloquean la publicación.
      - run: npm test
        continue-on-error: ${{ matrix.os != 'windows-latest' }}
      - name: Build
        run: npx electron-vite build && npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "${TAG#v}" --generate-notes --repo "$GITHUB_REPOSITORY" || true
          files=$(ls release/*.exe release/*.dmg release/*.zip release/*.blockmap release/latest*.yml 2>/dev/null || true)
          for i in 1 2 3; do
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY" && break
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
