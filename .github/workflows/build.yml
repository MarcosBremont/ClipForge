name: Build and release
# Al subir una etiqueta (git tag v1.0.1 && git push --tags) se compilan los instaladores y se
# publican en GitHub Releases junto con latest.yml / latest-mac.yml, que es lo que lee la app para actualizarse.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build and publish
        run: npx electron-vite build && npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
